# Shared routing for netaffil.com, included by both server blocks in affylitics.conf.

proxy_set_header Host $host;
proxy_set_header X-Real-IP $aff_client_ip;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header CF-IPCountry $http_cf_ipcountry;

client_max_body_size 256k;

# Click redirects go straight to Rust: the hot path.
location /go/ {
    limit_req zone=aff_go burst=100 nodelay;
    proxy_pass http://127.0.0.1:8100;
}

location /api/ {
    limit_req zone=aff_api burst=40 nodelay;
    proxy_pass http://127.0.0.1:8100;
}

# Provider webhooks only; the rest of the intel service stays private.
location /hooks/ {
    limit_req zone=aff_api burst=40 nodelay;
    proxy_pass http://127.0.0.1:8200/webhooks/;
}

location /internal/ { return 404; }

location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }

location /_next/static/ {
    proxy_pass http://127.0.0.1:3100;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location / {
    proxy_pass http://127.0.0.1:3100;
}
