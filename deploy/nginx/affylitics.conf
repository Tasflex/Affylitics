# /etc/nginx/sites-available/affylitics  (symlinked into sites-enabled)
# netaffil.com behind Cloudflare. Fully separate from the theloadcalc server block: its own
# server_name, map, rate-limit zones (aff_*) and upstream ports (3100/8100/8200).
# Origin certificate: Let's Encrypt via `certbot certonly --webroot -w /var/www/letsencrypt`.

# Real client IP from Cloudflare, scoped to these server blocks.
map $http_cf_connecting_ip $aff_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

limit_req_zone $aff_client_ip zone=aff_api:10m rate=20r/s;
limit_req_zone $aff_client_ip zone=aff_go:10m rate=50r/s;

server {
    listen 80;
    listen [::]:80;
    server_name netaffil.com www.netaffil.com;

    # Cloudflare "Flexible" SSL reaches us over HTTP with X-Forwarded-Proto: https; serve those
    # directly instead of redirecting (which would loop). Everything else goes to HTTPS, except
    # certificate challenges.
    set $aff_redirect 1;
    if ($http_x_forwarded_proto = "https") { set $aff_redirect 0; }
    if ($host = "www.netaffil.com") { set $aff_redirect 1; }
    if ($request_uri ~ "^/\.well-known/acme-challenge/") { set $aff_redirect 0; }
    if ($aff_redirect) { return 301 https://netaffil.com$request_uri; }

    include /var/www/affylitics/deploy/nginx/affylitics-locations.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name netaffil.com www.netaffil.com;

    ssl_certificate     /etc/letsencrypt/live/netaffil.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/netaffil.com/privkey.pem;

    if ($host = "www.netaffil.com") { return 301 https://netaffil.com$request_uri; }

    include /var/www/affylitics/deploy/nginx/affylitics-locations.conf;
}
