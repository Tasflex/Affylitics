# /etc/nginx/sites-available/affylitics  (symlink into sites-enabled)
# Cloudflare terminates public TLS; this origin certificate covers the Cloudflare → VPS hop.
# Kept fully separate from the theloadcalc server block.

# Real client IP from Cloudflare (ranges: https://www.cloudflare.com/ips/). Scoped to this file's
# server blocks via the map below rather than global real_ip settings, so theloadcalc is untouched.
map $http_cf_connecting_ip $aff_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

limit_req_zone $aff_client_ip zone=aff_api:10m rate=20r/s;
limit_req_zone $aff_client_ip zone=aff_go:10m rate=50r/s;

server {
    listen 80;
    server_name network.affylitics.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name network.affylitics.com;

    ssl_certificate     /etc/ssl/affylitics/origin.pem;
    ssl_certificate_key /etc/ssl/affylitics/origin.key;

    client_max_body_size 256k;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $aff_client_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header CF-IPCountry $http_cf_ipcountry;

    # Click redirects: straight to Rust, the hot path.
    location /go/ {
        limit_req zone=aff_go burst=100 nodelay;
        proxy_pass http://127.0.0.1:8100;
    }

    location /api/ {
        limit_req zone=aff_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8100;
    }

    # Provider webhooks only; the rest of the intel service stays private.
    location /hooks/ {
        limit_req zone=aff_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8200/webhooks/;
    }

    location /internal/ { return 404; }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
    }
}
